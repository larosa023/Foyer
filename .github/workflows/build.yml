name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig
        run: pip install ziglang

      - name: Build Foyer.exe
        run: ./build.sh

      - name: Package
        run: |
          cp README.md dist/
          cd dist
          zip Foyer-win-x64.zip Foyer.exe README.md
          sha256sum Foyer.exe Foyer-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Foyer-win-x64
          path: |
            dist/Foyer.exe
            dist/SHA256SUMS.txt

      # A release is published automatically when FOYER_VERSION in src/common.h
      # changes on main (or when a v* tag is pushed). Versions with a "-" such as
      # 0.3.0-beta.1 are published as pre-releases (the Beta update channel).
      - name: Decide release
        id: rel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'FOYER_VERSION L"\K[^"]+' src/common.h)
          TAG="v$VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Will publish $TAG"
          fi

      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Foyer ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body_path: CHANGELOG-latest.md
          files: |
            dist/Foyer-win-x64.zip
            dist/Foyer.exe
            dist/SHA256SUMS.txt
